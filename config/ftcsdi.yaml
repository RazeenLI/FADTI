
#type: args

diffusion:
  layers: 4 
  channels: 64 
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.5
  num_steps: 50
  schedule: "quad"
  is_linear: False

model:
  is_unconditional: False
  timeemb: 128
  featureemb: 16
  target_strategy: "random"
  method: "fbm"

train:
  epochs: 500
  lr: 1.0e-3
  itr_per_epoch: 1.0e+8
  save_strategy: "best"