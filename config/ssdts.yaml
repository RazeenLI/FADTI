train:
  epochs: 100
  lr: 0.0002
  save_strategy: best

model:
  layers: 4
  seq_dim: 64
  res_channels: 64
  diffusion_embedding_dim: 128
  num_ssm: 1
  cond_ssm_num: 1
  input_ssm_num: 1
  num_ch: 64
  expand_c: 2
  expand_s: 2
  headdim_c: 16
  headdim_s: 16
  only_generate_missing: true
  valid_all_steps: false

diffusion:
  num_steps: 100
  schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
